<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Smooth rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  
  <!-- Inner subtle border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35"/>
  
  <!-- Crossed Repair Tools (🛠️) in clean crisp white vector -->
  <g filter="url(#shadow)" transform="translate(32, 32)">
    <!-- Wrench (Angled -45 deg) -->
    <g transform="rotate(-45)">
      <rect x="-3" y="-18" width="6" height="26" rx="3" fill="#ffffff"/>
      <path d="M-9,-16 C-9,-23 9,-23 9,-16 C9,-12 6,-9 4,-8 L4,-12 C4,-14 2,-15 0,-15 C-2,-15 -4,-14 -4,-12 L-4,-8 C-6,-9 -9,-12 -9,-16 Z" fill="#ffffff"/>
      <circle cx="0" cy="8" r="6" fill="#ffffff"/>
      <circle cx="0" cy="8" r="3" fill="#0284c7"/>
    </g>
    <!-- Screwdriver (Angled 45 deg) -->
    <g transform="rotate(45)">
      <rect x="-2" y="-22" width="4" height="20" rx="1" fill="#f8fafc"/>
      <rect x="-3" y="-23" width="6" height="2" rx="0.5" fill="#e2e8f0"/>
      <rect x="-5" y="-2" width="10" height="18" rx="4" fill="#ffffff"/>
      <line x1="-3" y1="3" x2="3" y2="3" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-3" y1="7" x2="3" y2="7" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-3" y1="11" x2="3" y2="11" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Top-right service sparkle -->
  <circle cx="49" cy="15" r="3.5" fill="#fef08a"/>
</svg>
